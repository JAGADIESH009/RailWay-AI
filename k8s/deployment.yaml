apiVersion: apps/v1
kind: Deployment
metadata:
  name: railway-ai-deployment
  labels:
    app: railway-ai
    tier: frontend-ai
    faculty-assignment: "irctc-qa-bilstm"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: railway-ai
  template:
    metadata:
      labels:
        app: railway-ai
    spec:
      containers:
      - name: railway-ai-chatbot
        image: railway-ai:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8501
          name: http
          protocol: TCP
        env:
        - name: STREAMLIT_SERVER_PORT
          value: "8501"
        - name: STREAMLIT_SERVER_ADDRESS
          value: "0.0.0.0"
        - name: STREAMLIT_SERVER_HEADLESS
          value: "true"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        # Streamlit health check endpoints for robust container lifecycle
        livenessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /_stcore/health
            port: 8501
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
